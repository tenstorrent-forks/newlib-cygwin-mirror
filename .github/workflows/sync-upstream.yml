name: Sync with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check user permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            
            if (permission.permission !== 'admin') {
              core.setFailed(`User ${context.actor} does not have admin access. Only admins can sync with upstream.`);
            }
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://sourceware.org/git/newlib-cygwin.git || true
          git remote -v
      
      - name: Fetch upstream changes
        run: git fetch upstream
      
      - name: Sync main branch with upstream
        run: |
          git checkout main
          git merge upstream/master --ff-only || git merge upstream/master -m "Sync with upstream master"
      
      - name: Push changes
        run: git push origin main
